<div class="kart-form-field">
  <label class="kart-form-field__label" [for]="inputId()">{{ label() }}</label>
  <ng-content />
  @if (error()) {
    <p class="kart-form-field__error" [id]="inputId() + '-error'">{{ error() }}</p>
  } @else if (hint()) {
    <p class="kart-form-field__hint" [id]="inputId() + '-hint'">{{ hint() }}</p>
  }
</div>
