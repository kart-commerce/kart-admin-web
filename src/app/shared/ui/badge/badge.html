<span
  class="kart-badge"
  [class.kart-badge--primary]="variant() === 'primary'"
  [class.kart-badge--success]="variant() === 'success'"
  [class.kart-badge--warning]="variant() === 'warning'"
  [class.kart-badge--danger]="variant() === 'danger'"
  [class.kart-badge--neutral]="variant() === 'neutral'"
><ng-content /></span>
